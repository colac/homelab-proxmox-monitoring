---
# Host preparation for the hosts this repo OWNS — the `monitoring` group only.
# Agent targets listed in inventory/hosts.yml belong to other repos (the
# workloads repo bootstraps the Nextcloud VM), so their disks and Docker are
# never touched from here.
- name: Preflight
  hosts: monitoring
  become: true
  gather_facts: true
  roles:
    # Shared with every layer; installed from the core repo at the tag pinned
    # in requirements.yml. Generic asserts first: address, Ubuntu, Docker.
    - colac.homelab.common
    # This repo's own asserts: vm.max_map_count and the stack secrets.
    - elastic_preflight
    # Moves /var/lib/docker (and containerd's images) onto the
    # Terraform-attached data disk, under LVM. Here, before any play that
    # starts a container, because migrating Docker's state means stopping
    # Docker — cheap on a fresh host, disruptive once Elasticsearch runs.
    - colac.homelab.docker_data
