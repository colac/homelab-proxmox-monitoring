---
# ===========================================================================
# Values shared across hosts. Hand-authored — Terraform never writes here, it
# only generates the inventory fragments next to this directory.
#
# Anything a role on host A needs to know about host B lives here rather than
# in a role's defaults/, because role defaults are not visible cross-host.
# That is why the ports and Fleet policy IDs below are in this file: the
# elastic_agent role runs on every host and has to build an enrollment URL
# pointing at the monitoring VM.
# ===========================================================================

# ---------------------------------------------------------------------------
# Stack version — the single pin. Bump here, roll out via playbook.
#
# The Packer template's elastic_agent_version should track this. If they
# drift, the elastic_agent role notices and reinstalls the agent from
# Elastic's .deb, so a stack bump does not strictly require a template
# rebuild — it just means every host re-downloads the package once.
# ---------------------------------------------------------------------------
stack_version: "9.5.4"

es_image: "docker.elastic.co/elasticsearch/elasticsearch:{{ stack_version }}"
kibana_image: "docker.elastic.co/kibana/kibana:{{ stack_version }}"
# Fleet Server bootstraps from the elastic-agent image, not a dedicated
# fleet-server one.
fleet_server_image: "docker.elastic.co/elastic-agent/elastic-agent:{{ stack_version }}"

# ---------------------------------------------------------------------------
# Layout
# ---------------------------------------------------------------------------
# Compose projects live here on every VM. Created by the core repo's Packer
# template (packer/ubuntu-*/http/user-data.yml.tpl) — this value must stay in sync
# with the template's elastic_base_dir variable, since Ansible only uses it to
# know where to render compose files, never to create the directory.
elastic_base_dir: /opt/elastic

# Where the CA cert lands on every host. Kibana, Fleet Server and every
# Elastic Agent read it from here to trust Elasticsearch's HTTP layer.
es_shared_certs_dir: "{{ elastic_base_dir }}/certs"

# Controller-local caches, outside git (see .gitignore). The generated CA and
# node cert, and the minted service/enrollment tokens, are machine state — not
# human-chosen secrets, so they do not belong in secrets.yaml. They live here,
# not in a role's defaults/, because they are written by one role and read
# back by several others on different hosts.
es_certs_local_cache_dir: "{{ playbook_dir }}/../.certs"
es_secrets_local_cache_dir: "{{ playbook_dir }}/../.secrets-cache"

# ---------------------------------------------------------------------------
# Ports
# ---------------------------------------------------------------------------
es_http_port: 9200
es_transport_port: 9300
# Referenced by the elastic_agent role on every host to build the enrollment
# URL, so it needs the cross-host visibility this file provides.
fleet_server_port: 8220

# ---------------------------------------------------------------------------
# Security — always on.
#
# Elasticsearch 8+ defaults to security enabled, and Fleet Server flatly
# requires a secured cluster to enroll agents against, so there is no
# "disabled" path here to fall back to.
# ---------------------------------------------------------------------------
es_security_enabled: true
cluster_name: homelab

# Human-chosen passwords. They arrive as environment variables: the repo-root
# secrets.yaml is SOPS-encrypted, and `mise run play …` decrypts it through
# .mise/sops-exec for that one ansible-playbook run, so nothing here is ever a
# literal and no vault password has to be typed. A bare ansible-playbook gets
# none of them — elastic_preflight then fails and says so.
#
# Everything else the stack needs — the CA, the node cert, service tokens,
# enrollment API keys — is generated and cached locally instead; see the cache
# dirs above.
es_elastic_password: "{{ lookup('env', 'ELASTIC_PASSWORD') }}"
kibana_system_password: "{{ lookup('env', 'KIBANA_SYSTEM_PASSWORD') }}"
kibana_encryption_key: "{{ lookup('env', 'KIBANA_ENCRYPTION_KEY') }}"

# ---------------------------------------------------------------------------
# Nextcloud's public hostname.
#
# Nextcloud itself is deployed by the workloads repo; this repo needs its name
# for two things: exporters_nextcloud_server scrapes Nextcloud through Caddy
# over it, and kibana_fqdn takes its zone from it (group_vars/monitoring.yml).
# In all.yml because the inventory's agent targets are not in `monitoring`.
# ---------------------------------------------------------------------------
nextcloud_domain: "{{ lookup('env', 'NEXTCLOUD_DOMAIN') }}"

# ---------------------------------------------------------------------------
# Let's Encrypt via Cloudflare DNS-01, for Kibana's certificate (kibana_tls).
#
# certbot proves control of the zone by writing an _acme-challenge TXT record.
# The workloads repo's Caddy does the same for Nextcloud with its OWN token, in
# its own secrets.yaml: rotating or revoking one cannot break the other. Scope
# this one to Zone:DNS:Edit on the one zone.
# ---------------------------------------------------------------------------
acme_email: "{{ lookup('env', 'ACME_EMAIL') }}"
cloudflare_dns_api_token: "{{ lookup('env', 'CLOUDFLARE_DNS_API_TOKEN') }}"

# ---------------------------------------------------------------------------
# Fleet agent policies
#
# Two policies, because a Fleet agent belongs to exactly one. The monitoring
# VM needs the Prometheus integration to scrape the exporters running on it;
# no other host should, so it cannot share the general policy.
# ---------------------------------------------------------------------------
homelab_agents_policy_id: homelab-agents-policy
monitoring_agent_policy_id: monitoring-agent-policy
