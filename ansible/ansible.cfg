[defaults]
# A directory, not a single file: every fragment inside is merged, so each
# Terraform project can generate its own without clobbering another's hosts
# (terraform/projects/monitoring writes inventory/monitoring.yml) while
# hosts.yml stays hand-authored. group_vars/ and host_vars/ inside it are
# treated as variable directories, not inventory sources.
inventory          = inventory/
# Defaults, plus .example so the tracked hosts.yml.example is not parsed as a
# real inventory source.
inventory_ignore_extensions = .example, .md, ~, .orig, .bak, .ini, .cfg, .retry, .pyc, .pyo
roles_path         = roles
remote_user        = ubuntu
private_key_file   = ~/.ssh/homelab-proxmox
host_key_checking  = False
retry_files_enabled = False
interpreter_python = auto_silent
deprecation_warnings = False

[privilege_escalation]
become         = True
become_method  = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
