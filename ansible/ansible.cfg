[defaults]
# A directory, not a single file: every fragment inside is merged, so each
# writer owns one file: Terraform (terraform/) generates inventory/monitoring.yml,
# and the hand-authored hosts.yml lists the agent targets other repos own. group_vars/ and host_vars/ inside it are
# treated as variable directories, not inventory sources.
inventory          = inventory/
# Defaults, plus .example so the tracked hosts.yml.example is not parsed as a
# real inventory source.
inventory_ignore_extensions = .example, .md, ~, .orig, .bak, .ini, .cfg, .retry, .pyc, .pyo
roles_path         = roles
# Per-repo, git-ignored, so this repo's pin of colac.homelab can never be
# shadowed by the workloads repo installing another tag into ~/.ansible.
collections_path   = collections
remote_user        = ubuntu
private_key_file   = ~/.ssh/homelab-proxmox
host_key_checking  = False
retry_files_enabled = False
interpreter_python = auto_silent
deprecation_warnings = False

[privilege_escalation]
become         = True
become_method  = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
